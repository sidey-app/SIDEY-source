name: SIDEY CI (release metadata checks)

on:
  # ci.yml owns pull request and main validation to avoid duplicate runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Release metadata checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release manifests and mirrors
        run: >-
          ./scripts/skills/verify_release_consistency.sh
          --allow-unreleased-source
