name: SIDEY CI
run-name: "SIDEY CI | ${{ github.event_name }} | ${{ github.ref_name }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select required checks
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.scope.outputs.scopes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/skills/validate_change.py

  shared:
    name: Repository checks
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.scopes), 'shared')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/skills/validate_contributor_architecture.py
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 -m unittest discover -s scripts/skills/release-notes/tests
      - run: python3 scripts/commerce_catalog.py --target shared --check
      - run: python3 scripts/commerce_catalog.py --target macos --check
      - run: python3 scripts/validate_pixel_assets.py
      - run: python3 scripts/skills/verify_release_consistency.py --allow-unreleased-source

  macos:
    name: macOS build and tests
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.scopes), 'macos')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate central pixel assets and mirrors
        run: python3 ./scripts/validate_pixel_assets.py

      - name: Read Xcode build version
        id: xcode
        run: |
          build_version=$(xcodebuild -version | awk '/^Build version / { print $3 }')
          test -n "$build_version"
          echo "build-version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package sources and artifacts
        id: packages
        uses: actions/cache@v6
        continue-on-error: true
        with:
          # Xcode package downloads only; DerivedData remains fresh for every run.
          path: ${{ runner.temp }}/sidey-source-packages
          key: sidey-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build-version }}-${{ hashFiles('macos/SIDEY.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Prepare fresh packages after a cache miss or restore failure
        if: steps.packages.outputs.cache-hit != 'true'
        run: rm -rf "$RUNNER_TEMP/sidey-source-packages"

      - name: Run native test suite
        run: ./scripts/macos/tests/test_native.sh -clonedSourcePackagesDirPath "$RUNNER_TEMP/sidey-source-packages"

  windows:
    name: Windows build and tests
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.scopes), 'windows')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Windows release metadata
        run: >-
          python ./scripts/skills/verify_release_consistency.py
          --platform windows
          --allow-unreleased-source

      - name: Validate central pixel assets and mirrors
        run: python ./scripts/validate_pixel_assets.py

      - name: Verify Windows product catalog and assets
        run: python -X utf8 ./windows/tools/sync_product_assets.py --check

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Verify formatting
        run: dotnet format windows/SIDEY.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Test
        id: tests
        run: dotnet test windows/SIDEY.Windows.slnx --configuration Release --no-restore --no-build --logger trx --collect:"XPlat Code Coverage" --settings windows/coverlet.runsettings --results-directory artifacts/coverage

      - name: Test Windows app smoke timeout policy
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/windows/tests/Test-PublishedApplicationTimeouts.ps1

      - name: Publish and verify self-contained payload
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish windows/src/Sidey.App/Sidey.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --no-restore -p:PublishSingleFile=false `
            --output build/windows/publish
          ./scripts/windows/tests/Test-SelfContainedPublish.ps1 -PublishDirectory ./build/windows/publish

      - name: Run Windows app smoke
        if: github.event_name == 'push'
        env:
          SIDEY_STORE_PREVIEW_SMOKE: '1'
          SIDEY_OVERLAY_STARTUP_SMOKE: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/windows/tests/Test-PublishedApplication.ps1 -PublishDirectory ./build/windows/publish -TimeoutSeconds 120

      - name: Compile NSIS installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          winget install NSIS.NSIS --exact --version 3.12 --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          $version = ([xml](Get-Content ./windows/src/Sidey.App/Sidey.App.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          ./scripts/windows/New-WindowsInstaller.ps1 -PublishDirectory ./build/windows/publish `
            -OutputDirectory ./build/windows/artifacts -Version $version

      - name: Upload coverage
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v5
        with:
          name: windows-validation-code-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  web:
    name: Website build and tests
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.scopes), 'web')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build and test website
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm test

      - name: Validate central pixel assets and mirrors
        run: python3 ./scripts/validate_pixel_assets.py

      - name: Validate release metadata preparation
        run: python3 -m unittest discover -s scripts/pages/tests

  gate:
    name: Required checks
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') }}
    needs: [scope, shared, macos, windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every applicable check, including missing or skipped jobs
        env:
          SIDEY_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/skills/validate_change.py gate
