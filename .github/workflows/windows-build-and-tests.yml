name: SIDEY CI (Windows build and tests)

# ci.yml owns automatic pull request and main validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-and-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Windows release metadata
        run: >-
          python ./scripts/skills/verify_release_consistency.py
          --platform windows
          --allow-unreleased-source

      - name: Validate central pixel assets and mirrors
        run: python ./scripts/validate_pixel_assets.py

      - name: Verify Windows product catalog and assets
        run: python -X utf8 ./windows/tools/sync_product_assets.py --check

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Verify formatting
        run: dotnet format windows/SIDEY.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Test
        id: tests
        run: dotnet test windows/SIDEY.Windows.slnx --configuration Release --no-restore --no-build --logger trx --collect:"XPlat Code Coverage" --settings windows/coverlet.runsettings --results-directory artifacts/coverage

      - name: Publish and verify self-contained payload
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish windows/src/Sidey.App/Sidey.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --no-restore -p:PublishSingleFile=false `
            --output build/windows/publish
          ./scripts/windows/tests/Test-SelfContainedPublish.ps1 -PublishDirectory ./build/windows/publish

      - name: Verify Windows app startup
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/windows/tests/Test-PublishedApplication.ps1 -PublishDirectory ./build/windows/publish -TimeoutSeconds 120

      - name: Compile NSIS installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          winget install NSIS.NSIS --exact --version 3.12 --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          $productVersion = python -X utf8 ./scripts/sidey_version.py --get productVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the SIDEY Product Version: exit code $LASTEXITCODE"
          }
          $releaseVersion = python -X utf8 ./scripts/sidey_version.py --get windowsReleaseVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the SIDEY Windows Release Version: exit code $LASTEXITCODE"
          }
          ./scripts/windows/New-WindowsInstaller.ps1 `
            -PublishDirectory ./build/windows/publish `
            -OutputDirectory ./build/windows/artifacts `
            -ProductVersion $productVersion `
            -ReleaseVersion $releaseVersion

      - name: Upload coverage
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v5
        with:
          name: windows-code-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Encrypt owner-only test candidate
        env:
          SIDEY_DEV_ARTIFACT_PASSWORD: ${{ secrets.SIDEY_DEV_ARTIFACT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:SIDEY_DEV_ARTIFACT_PASSWORD)) {
            throw 'A private candidate password must be configured before uploading.'
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw 'The runner must provide 7-Zip for encrypted candidate delivery.'
          }
          $installers = @(Get-ChildItem -LiteralPath ./build/windows/artifacts -Filter '*Setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one candidate installer.' }
          $archive = Join-Path $env:RUNNER_TEMP "sidey-windows-private-$env:GITHUB_SHA.7z"
          if (Test-Path -LiteralPath $archive) { throw 'Candidate archive already exists.' }
          & $sevenZip a -t7z -mhe=on "-p$env:SIDEY_DEV_ARTIFACT_PASSWORD" $archive $installers[0].FullName
          & $sevenZip t "-p$env:SIDEY_DEV_ARTIFACT_PASSWORD" $archive

      - name: Upload encrypted manual test candidate
        uses: actions/upload-artifact@v5
        with:
          name: sidey-windows-private-${{ github.sha }}
          path: ${{ runner.temp }}/sidey-windows-private-${{ github.sha }}.7z
          if-no-files-found: error
          retention-days: 7
