name: SIDEY Website deployment
run-name: SIDEY Website deployment | ${{ github.event_name }} | ${{ github.event.action || 'dispatch' }} | ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'website/src/**'
      - 'website/public/**'
      - 'website/astro.config.mjs'
      - 'website/package.json'
      - 'website/pnpm-lock.yaml'
      - 'website/pnpm-workspace.yaml'
      - 'website/tsconfig.json'
      - 'scripts/pages/**'
      - '.github/workflows/website-deployment.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Build and test website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build and test website
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm test

      - name: Validate central pixel assets and mirrors
        run: python3 ./scripts/validate_pixel_assets.py

      - name: Validate release metadata preparation
        run: python3 -m unittest discover -s scripts/pages/tests

      - name: Upload tested website build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: pages-website-dist
          path: website/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested website build
        uses: actions/download-artifact@v5
        with:
          name: pages-website-dist
          path: website/dist

      - name: Prepare verified release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content ./release/windows.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $tag = "windows-v$version"
          $installerName = "SIDEY-Windows-x64-v${version}-Setup.exe"

          $release = gh release view $tag --json isDraft,isPrerelease,assets |
            ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Windows release must be a published regular release: $tag"
          }
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($assetNames.Count -ne 1 -or $assetNames[0] -cne $installerName) {
            throw "Windows release must contain only $installerName"
          }

          New-Item -ItemType Directory -Path ./build/windows-pages-release -Force |
            Out-Null
          gh release download $tag `
            --pattern $installerName `
            --dir ./build/windows-pages-release `
            --clobber

          python3 ./scripts/pages/prepare_release_metadata.py `
            --website-dir ./website/dist `
            --output-dir ./build/pages-site `
            --windows-release-manifest ./release/windows.json `
            --windows-release-installer "./build/windows-pages-release/$installerName"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
